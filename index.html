<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Japanese Learning App - local-first pop culture study hub" />
    <title>Pop Culture Japanese</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Zero-cost MVP</p>
          <h1>Pop Culture Japanese</h1>
        </div>
        <div class="topbar-actions">
          <button class="chip" data-toggle="furigana">Furigana: On</button>
          <button class="chip" data-toggle="romaji">Romaji: Off</button>
          <button class="chip" data-toggle="translation">Translation: On</button>
        </div>
      </header>

      <nav class="nav" aria-label="Main">
        <button class="nav-item active" data-view="learn">Learn</button>
        <button class="nav-item" data-view="practice">Practice</button>
        <button class="nav-item" data-view="review">Review</button>
        <button class="nav-item" data-view="progress">Progress</button>
        <button class="nav-item" data-view="admin">Admin</button>
      </nav>

      <main id="app" class="content"></main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
