<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AI Japanese Learning App - local-first pop culture study hub" />
    <meta name="theme-color" content="#0a0e1a" />
    <title>Pop Culture Japanese</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff5c7a'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E%E6%97%A5%3C/text%3E%3C/svg%3E" />
    <link rel="preload" href="./fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">日</span>
          <div>
            <p class="eyebrow">Learn Japanese through pop culture</p>
            <h1>Pop Culture Japanese</h1>
          </div>
        </div>
        <div class="topbar-actions" role="group" aria-label="Reading aids">
          <button class="toggle" data-toggle="furigana" aria-pressed="true">
            <span class="toggle-glyph" aria-hidden="true">ふ</span><span class="toggle-label">Furigana</span><span class="toggle-state">On</span>
          </button>
          <button class="toggle" data-toggle="romaji" aria-pressed="false">
            <span class="toggle-glyph" aria-hidden="true">Aa</span><span class="toggle-label">Romaji</span><span class="toggle-state">Off</span>
          </button>
          <button class="toggle" data-toggle="translation" aria-pressed="true">
            <span class="toggle-glyph" aria-hidden="true">EN</span><span class="toggle-label">Translation</span><span class="toggle-state">On</span>
          </button>
        </div>
      </header>

      <nav class="nav" aria-label="Main">
        <button class="nav-item active" data-view="learn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span>Learn</span>
        </button>
        <button class="nav-item" data-view="practice">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
          <span>Practice</span>
        </button>
        <button class="nav-item" data-view="review">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 10 5-10 5L2 7l10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
          <span>Review</span>
        </button>
        <button class="nav-item" data-view="progress">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 16V11"/><path d="M12 16V7"/><path d="M17 16v-3"/></svg>
          <span>Progress</span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/></svg>
          <span>Settings</span>
        </button>
        <button class="nav-item" data-view="admin">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
          <span>Admin</span>
        </button>
      </nav>

      <main id="app" class="content"></main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
